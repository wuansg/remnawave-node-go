name: Publish Docker Image arm64

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to push. Defaults to sha-<short-sha>-arm64."
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REMNAWAVE_NODE_VERSION: 2.7.0

jobs:
  docker-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.image_tag }}" ]; then
            tag="${{ inputs.image_tag }}"
          else
            tag="sha-${GITHUB_SHA::7}-arm64"
          fi

          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          tags="${image}:${tag}"
          if [ "${GITHUB_REF_NAME}" = "${GITHUB_DEFAULT_BRANCH}" ]; then
            tags="${tags},${image}:main-arm64"
          fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            REMNAWAVE_NODE_VERSION=${{ env.REMNAWAVE_NODE_VERSION }}
          tags: ${{ steps.tags.outputs.tags }}
