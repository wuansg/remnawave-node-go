name: Publish Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REMNAWAVE_NODE_VERSION: 3.11.0
  SING_BOX_VERSION: 1.14.0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Unit and race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Verify source version matches image tag
        run: |
          grep -F 'const defaultVersion = "${{ env.REMNAWAVE_NODE_VERSION }}"' internal/config/config.go
          grep -F 'ARG REMNAWAVE_NODE_VERSION=${{ env.REMNAWAVE_NODE_VERSION }}' Dockerfile

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.REMNAWAVE_NODE_VERSION }},priority=1000
            type=raw,value=main,enable={{is_default_branch}},priority=200
            type=raw,value=latest,enable={{is_default_branch}},priority=100
            type=sha,format=short,priority=50

      - name: Reject an existing immutable version tag
        run: |
          if docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.REMNAWAVE_NODE_VERSION }}" >/dev/null 2>&1; then
            echo "Version tag ${{ env.REMNAWAVE_NODE_VERSION }} already exists; bump the Agent version before publishing."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            REMNAWAVE_NODE_VERSION=${{ env.REMNAWAVE_NODE_VERSION }}
            SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
