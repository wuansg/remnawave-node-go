name: Publish Docker Image

on:
  push:
    branches:
      - ops/oracle-arm64-3.13.0
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REMNAWAVE_NODE_VERSION: 3.13.0
  SING_BOX_VERSION: 1.14.0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Unit and race tests
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Verify source version matches image tag
        run: |
          grep -F 'const defaultVersion = "${{ env.REMNAWAVE_NODE_VERSION }}"' internal/config/config.go
          grep -F 'ARG REMNAWAVE_NODE_VERSION=${{ env.REMNAWAVE_NODE_VERSION }}' Dockerfile

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.REMNAWAVE_NODE_VERSION }}-arm64,priority=1000

      - name: Reject an existing one-off ARM64 tag
        run: |
          if docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.REMNAWAVE_NODE_VERSION }}-arm64" >/dev/null 2>&1; then
            echo "One-off ARM64 tag ${{ env.REMNAWAVE_NODE_VERSION }}-arm64 already exists."
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            REMNAWAVE_NODE_VERSION=${{ env.REMNAWAVE_NODE_VERSION }}
            SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Publish combined version tag
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${REMNAWAVE_NODE_VERSION}" \
            "${REGISTRY}/${IMAGE_NAME}@sha256:e7e7fe7898a5873d843a9ea8b5392b1214c7140218ac2a422153824f2fc8cede" \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
