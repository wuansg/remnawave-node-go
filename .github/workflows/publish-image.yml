name: One-off Oracle ARM64 3.15.0

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REMNAWAVE_NODE_VERSION: 3.15.0
  SING_BOX_VERSION: 1.14.0

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.4'
          cache: true

      - name: Unit and race tests
        run: go test -race ./...

      - name: Test bounded hardware tools in the runtime distribution
        run: |
          CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/benchmark.test" ./internal/benchmark
          docker run --rm -e BENCHMARK_HARDWARE_TEST=1 \
            -v "$RUNNER_TEMP/benchmark.test:/benchmark.test:ro" alpine:3.22 \
            sh -c 'apk add --no-cache fio sysbench coreutils && /benchmark.test -test.v -test.run TestHardwareTools'

      - name: Test patched Snell core and user traffic accounting
        run: |
          git clone --depth 1 --branch "v${SING_BOX_VERSION}" https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sing-box-snell"
          patch -d "$RUNNER_TEMP/sing-box-snell" -p1 < third_party/sing-box-patches/0001-expose-user-in-clash-connections.patch
          patch -d "$RUNNER_TEMP/sing-box-snell" -p1 < third_party/sing-box-patches/0002-snell-multi-psk.patch
          cd "$RUNNER_TEMP/sing-box-snell"
          go test -race ./protocol/snell ./option
          go build -tags with_v2ray_api,with_clash_api,with_quic -o "$RUNNER_TEMP/sing-box-test" ./cmd/sing-box
          cd "$GITHUB_WORKSPACE"
          SING_BOX_TEST_BINARY="$RUNNER_TEMP/sing-box-test" go test -race ./internal/node -run TestSnellIntegration -count=1

      - name: Vet
        run: go vet ./...

      - name: Verify source version matches image tag
        run: |
          grep -F 'const defaultVersion = "${{ env.REMNAWAVE_NODE_VERSION }}"' internal/config/config.go
          grep -F 'ARG REMNAWAVE_NODE_VERSION=${{ env.REMNAWAVE_NODE_VERSION }}' Dockerfile

  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU for this one-off ARM64 release
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.REMNAWAVE_NODE_VERSION }}-arm64,priority=1000
          labels: |
            org.opencontainers.image.version=${{ env.REMNAWAVE_NODE_VERSION }}

      - name: Reject an existing immutable version tag
        run: |
          if docker buildx imagetools inspect "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.REMNAWAVE_NODE_VERSION }}-arm64" >/dev/null 2>&1; then
            echo "One-off ARM64 tag ${{ env.REMNAWAVE_NODE_VERSION }}-arm64 already exists."
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            REMNAWAVE_NODE_VERSION=${{ env.REMNAWAVE_NODE_VERSION }}
            SING_BOX_VERSION=${{ env.SING_BOX_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
