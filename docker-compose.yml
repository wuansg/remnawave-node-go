services:
  remnanode:
    container_name: remnanode
    image: ${REMNAWAVE_IMAGE:-ghcr.io/wuansg/remnawave-node-go:main}
    pull_policy: always
    network_mode: host
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      NODE_PORT: ${NODE_PORT}
      SECRET_KEY: ${SECRET_KEY}
      SING_BOX_API_PORT: ${SING_BOX_API_PORT}
      INTERNAL_REST_TOKEN: ${INTERNAL_REST_TOKEN:-}
      INTERNAL_SOCKET_PATH: ${INTERNAL_SOCKET_PATH:-/run/remnawave/internal.sock}
      SUPERVISORD_SOCKET_PATH: ${SUPERVISORD_SOCKET_PATH:-/run/remnawave/supervisord.sock}
      SUPERVISORD_PID_PATH: ${SUPERVISORD_PID_PATH:-/run/remnawave/supervisord.pid}
      SING_BOX_CONFIG_PATH: ${SING_BOX_CONFIG_PATH:-/run/remnawave/sing-box.json}
      SING_BOX_BINARY_PATH: ${SING_BOX_BINARY_PATH:-/usr/local/bin/sing-box}
      SING_BOX_LAST_GOOD_CONFIG_PATH: ${SING_BOX_LAST_GOOD_CONFIG_PATH:-/var/lib/remnanode/sing-box.last-good.json}
      USAGE_SNAPSHOT_DB_PATH: ${USAGE_SNAPSHOT_DB_PATH:-/var/lib/remnanode/stats.db}
      FORWARDING_STATE_PATH: ${FORWARDING_STATE_PATH:-/var/lib/remnanode/forwarding.json}
    volumes:
      - ${ANYTLS_CERT_DIR:-/root/cert/anytls}:${ANYTLS_CERT_DIR:-/root/cert/anytls}:ro
      - remnanode-stats:/var/lib/remnanode

volumes:
  remnanode-stats:
